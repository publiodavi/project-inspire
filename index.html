<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧠 Inspire</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="top-bar">
        <a href="https://github.com/SEU_USUARIO" target="_blank" class="icon-link" aria-label="Meu GitHub">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
        </a>
        <button id="btn-theme" class="icon-link theme-toggle" aria-label="Alternar tema">🌙</button>
    </div>

    <main class="container">
        <div class="quote-box">
            <p id="texto-frase" class="quote-text">Buscando inspiração...</p>
            <p id="autor-frase" class="quote-author"></p>
        </div>

        <div class="controls">
            <div class="flags">
                <button onclick="mudarIdioma('pt')" title="Português">🇧🇷</button>
                <button onclick="mudarIdioma('en')" title="English">🇺🇸</button>
                <button onclick="mudarIdioma('es')" title="Español">🇪🇸</button>
            </div>
            
            <button id="btn-nova-frase" class="btn-primary">Me inspire</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
